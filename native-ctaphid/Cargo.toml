[package]
name = "pocof7-native-ctaphid"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "AndroidKeyStore-only native CTAPHID transport for Poco F7 (development)"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
base64 = "0.22"
sha2 = "0.10"
p256 = { version = "0.13", features = ["arithmetic", "ecdsa"] }

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "z"
